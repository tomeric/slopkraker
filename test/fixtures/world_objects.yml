# `kind` says how a thing is simulated -- static is a fixed collider, prop is a dynamic
# body that can be knocked about and broken. `recipe.kind` says what it is, which is what
# the client colours and what a hit is labelled with.
#
# Coordinates here are deliberate rather than inherited. Under the old arena a test aimed
# at (0, 2.0, -32) because that is where a crate stack happened to land; here the stack
# is put where the test wants it.

# --- flat: ground and nothing else ------------------------------------------------

flat_ground:
  world: flat
  kind: static
  name: ground
  cx: 0
  cz: 0
  x: 0.0
  y: -0.5
  z: 0.0
  yaw: 0.0
  radius: 0.0
  recipe:
    kind: ground
    size: [ 400.0, 1.0, 400.0 ]
    colour: "#4a5159"
    friction: 1.1

# --- targets: ground, a stack to plough through, a pillar to clip ------------------

targets_ground:
  world: targets
  kind: static
  name: ground
  cx: 0
  cz: 0
  x: 0.0
  y: -0.5
  z: 0.0
  yaw: 0.0
  radius: 0.0
  recipe:
    kind: ground
    size: [ 400.0, 1.0, 400.0 ]
    colour: "#4a5159"
    friction: 1.1

# Three crates squarely stacked 20m ahead of the spawn -- yaw 0 faces +z -- so hitting
# the bottom one brings the pile down. Same mass, health and size as the arena's, so the
# thresholds the damage tests assert against are unchanged.
<% 3.times do |level| %>
targets_crate_<%= level %>:
  world: targets
  kind: prop
  name: crate_<%= level %>
  cx: 0
  cz: 0
  x: 0.0
  y: <%= 0.75 + level * 1.5 %>
  z: 20.0
  yaw: 0.0
  radius: 1.5
  recipe:
    kind: crate
    size: [ 1.5, 1.5, 1.5 ]
    mass: 55.0
    health: 110.0
    debris_count: 6
    colour: "#b5651d"
<% end %>

# Off to one side, so a test can reach it without going through the crates. Light enough
# to topple on contact rather than behave like a wall.
targets_pillar:
  world: targets
  kind: prop
  name: pillar
  cx: -1
  cz: 0
  x: -20.0
  y: 2.2
  z: 20.0
  yaw: 0.0
  radius: 2.2
  recipe:
    kind: pillar
    size: [ 1.0, 4.4, 1.0 ]
    mass: 90.0
    health: 200.0
    debris_count: 8
    colour: "#9aa0a6"

# A 12 x 15m three-storey gabled house, off to the right of the spawn so it can be driven
# at from the front. Brick walls on a concrete plinth, glass windows under steel lintels,
# a timber door, a timber deck over a concrete slab, plaster partitions and a tiled roof:
# every material in the table, in one building.
#
# piece_count and storey_count are what the server bounds-checks a reported piece index
# against, so they are stored rather than derived per request. A test asserts they match
# what the generator actually produces -- if they drift, a real index would be rejected or
# a bogus one accepted.
targets_house:
  world: targets
  kind: building
  name: house
  cx: 0
  cz: 0
  x: 20.0
  y: 0.0
  z: 8.0
  yaw: 0.0
  radius: 20.0
  piece_count: 1553
  storey_count: 3
  recipe:
    kind: building
    footprint: [ [ 0, 0 ], [ 12, 0 ], [ 12, 15 ], [ 0, 15 ] ]
    storeys: 3
    storey_height: 3.0
    eaves: 9.0
    ridge: 12.75
    roof: gable
    cell: 1.0
    seed: 7

# --- street: a road, and six houses down each side of it ---------------------------

street_ground:
  world: street
  kind: static
  name: ground
  cx: 0
  cz: 0
  x: 0.0
  y: -0.5
  z: 0.0
  yaw: 0.0
  radius: 0.0
  recipe:
    kind: ground
    size: [ 400.0, 1.0, 400.0 ]
    colour: "#4a5159"
    friction: 1.1

# Asphalt, and a centimetre proud of the ground rather than flush with it. Two coplanar
# surfaces z-fight; a centimetre is below anything the suspension can feel and above
# anything the depth buffer argues about.
street_road:
  world: street
  kind: static
  name: road
  cx: 0
  cz: 0
  x: 0.0
  y: -0.09
  z: 45.0
  yaw: 0.0
  radius: 0.0
  recipe:
    kind: road
    size: [ 12.0, 0.2, 150.0 ]
    colour: "#2e3236"
    friction: 1.1

# The houses. A building ignores `yaw` on the client -- only its origin is read -- so a
# house is aimed by where its footprint is written, never by rotating it. Every footprint
# therefore runs the same way round in positive local coordinates and the origin does the
# placing: the east side starts at x = 10 and grows away from the road, the west side is
# placed back by its own depth so that it ENDS at x = -10. Both sides leave a four metre
# garden off a six metre half-road.
#
# `piece_count` is written down rather than derived, and deliberately so: it is what the
# server bounds-checks a reported index against without generating the building, so a copy
# that cannot drift from the generator would not be testing anything. world_summary_test
# checks every one of these against what the generator actually produces.
<%
  street_houses = [
    # name,           side,  depth, frontage, storeys, roof,    cell, seed, pieces
    [ "house_east_1", :east,     9,       11,       2, "gable", 1.0,    11,   738 ],
    [ "house_east_2", :east,    11,       13,       3, "gable", 1.5,    12,   613 ],
    [ "house_east_3", :east,     8,       10,       2, "flat",  1.5,    13,   277 ],
    [ "house_east_4", :east,    12,       14,       4, "flat",  1.5,    14,   786 ],
    [ "house_east_5", :east,    10,       12,       3, "gable", 1.5,    15,   562 ],
    [ "house_east_6", :east,     9,       10,       2, "gable", 1.5,    16,   356 ],
    [ "house_west_1", :west,    10,       12,       3, "flat",  1.5,    21,   518 ],
    [ "house_west_2", :west,     9,       11,       2, "gable", 1.5,    22,   372 ],
    [ "house_west_3", :west,    12,       13,       4, "gable", 1.0,    23,  1726 ],
    [ "house_west_4", :west,     8,       10,       2, "flat",  1.5,    24,   277 ],
    [ "house_west_5", :west,    11,       14,       3, "gable", 1.5,    25,   621 ],
    [ "house_west_6", :west,    10,       11,       2, "flat",  1.5,    26,   359 ]
  ]
%>
<% street_houses.each_with_index do |(name, side, depth, frontage, storeys, roof, cell, seed, pieces), index| %>
<%
  eaves = storeys * 3.0
  # A flat roof sits AT the eaves. The recipe rejects a ridge below them, not one level
  # with them, which is what makes "flat" a height rather than a special case.
  ridge = roof == "gable" ? eaves + 2.75 : eaves
  x = side == :east ? 10.0 : -(10.0 + depth)
  z = 8.0 + (index % 6) * 17.0
%>
street_<%= name %>:
  world: street
  kind: building
  name: <%= name %>
  cx: <%= (x / 125).floor %>
  cz: 0
  x: <%= x %>
  y: 0.0
  z: <%= z %>
  yaw: 0.0
  radius: <%= [ depth, frontage ].max %>
  piece_count: <%= pieces %>
  storey_count: <%= storeys %>
  recipe:
    kind: building
    footprint: [ [ 0, 0 ], [ <%= depth %>, 0 ], [ <%= depth %>, <%= frontage %> ], [ 0, <%= frontage %> ] ]
    storeys: <%= storeys %>
    storey_height: 3.0
    eaves: <%= eaves %>
    ridge: <%= ridge %>
    roof: <%= roof %>
    cell: <%= cell %>
    seed: <%= seed %>
<% end %>

# --- hills: one house, on a slope -------------------------------------------------

# The targets house with its own seed, standing where the ground falls about seventy
# centimetres across its footprint. Its y is the MEAN of the terrain under its corners --
# a seeder's decision, per the persistent-world design, and never a recipe field -- so it
# is buried a little uphill and clear a little downhill. The slope is deliberate: a test
# that heaps of rubble are placed on the terrain can only tell that apart from "placed at
# the building's own height" if the two differ, and on a level site they do not.
<% hills_house_x, hills_house_z = -120.0, -135.0 %>
hills_house:
  world: hills
  kind: building
  name: house
  cx: <%= (hills_house_x / 100).floor %>
  cz: <%= (hills_house_z / 100).floor %>
  x: <%= hills_house_x %>
  y: <%= Game::Terrain::Hills.base_height(hills_house_x, hills_house_z, 12.0, 15.0).round(2) %>
  z: <%= hills_house_z %>
  yaw: 0.0
  radius: 20.0
  piece_count: 1553
  storey_count: 3
  recipe:
    kind: building
    footprint: [ [ 0, 0 ], [ 12, 0 ], [ 12, 15 ], [ 0, 15 ] ]
    storeys: 3
    storey_height: 3.0
    eaves: 9.0
    ridge: 12.75
    roof: gable
    cell: 1.0
    seed: 31
