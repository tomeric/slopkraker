# Narrow worlds, one per thing worth testing.
#
# The suite used to boot a 380m arena -- 255 static bodies and 120 props -- for every
# test, then use three of them. Worse than slow: driving_test measured acceleration and
# braking from a spawn on a cambered, kerbed corner, and had to teleport to the infield
# whenever the camber would have decided the result. A test that says what ground it
# wants gets a straight answer.
#
# Neither of these carries terrain rows. A world with no tile for a point samples its
# fallback height, which for flat ground is the whole answer -- so nothing binary has to
# go in a fixture.

flat:
  slug: flat
  name: Flat
  # Big enough that nothing reaches an edge within a test. At 30m/s a three second run
  # covers 90m, and it is 200m from the middle to the rim.
  bounds: [ -200, -200, 200, 200 ]
  spawns:
    - position: [ 0.0, 2.0, 0.0 ]
      yaw: 0.0
  content_digest: flatworld001

targets:
  slug: targets
  name: Targets
  bounds: [ -200, -200, 200, 200 ]
  # Facing the crates, which sit down the -z axis. Spawning pointed at what a test is
  # about to hit saves every one of them a turn.
  spawns:
    - position: [ 0.0, 2.0, 0.0 ]
      yaw: 0.0
  content_digest: targetworld1

# A row of houses down both sides of a road. Everything the architecture claims about
# MULTIPLE buildings -- one draw call per material across all of them, one shared spatial
# grid, one shared pool of falling slabs, collapses that stay independent -- was until now
# asserted against a world containing exactly one house, which is to say asserted against
# nothing.
#
# Twelve, not a city. Past roughly a hundred buildings the inline spec and the up-front
# InstancedMesh allocation both want streaming, which is its own design; twelve is the step
# that de-risks it and still fits in 103 KB of spec.
street:
  slug: street
  name: Street
  bounds: [ -200, -200, 200, 200 ]
  # On the road at the near end, facing up it, so the houses are on both sides from the
  # first frame and a test that wants to drive at one does not have to turn first.
  spawns:
    - position: [ 0.0, 2.0, -12.0 ]
      yaw: 0.0
  content_digest: streetworld1
